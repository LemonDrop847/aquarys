[project]
name = "aquarys-backend"
version = "0.1.0"
description = "AQUARYS - Trust-aware environmental intelligence system for urban streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.3",
    "geoalchemy2>=0.15.2",
    "pgvector>=0.3.5",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "pandas>=2.2.3",
    "numpy>=2.1.1",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.2",
    "shapely>=2.0.6",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aquarys"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
